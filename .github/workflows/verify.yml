name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    name: Pinned contract and shared corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned tooling
        run: python -m pip install --requirement contract/tools/requirements.txt
      - name: Verify offline
        run: |
          python -B contract/tools/contract.py verify
          python -B -m unittest discover -s contract/tools -v

  node:
    name: Node ${{ matrix.node }} package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '22.x', '24.0.0', '24.x', '26.0.0', '26.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          package-manager-cache: false
      - name: Install pinned npm and dependencies
        run: |
          npm install --global --ignore-scripts --no-audit --no-fund npm@11.20.0
          node --version
          test "$(npm --version)" = 11.20.0
          npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:generated
      - run: npm run lint
      - run: npm test
      - run: npm run check:pack
