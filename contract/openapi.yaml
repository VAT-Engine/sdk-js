      tags:
      - VAT information
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/ExpectedContext'
      - in: query
        name: country
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{2}$
        description: EU ISO country; GR and TEDB alias EL are accepted.
      - in: query
        name: scheme
        required: true
        schema:
          type: string
          enum:
          - cn
          - cpa
      - in: query
        name: code
        required: true
        schema:
          type: string
          maxLength: 24
        description: Full item code; conventional CN spaces or CPA dots accepted.
      - in: query
