  /v1/vat/sme-thresholds:
    get:
      summary: List SME Thresholds
      security: []
      description: "Retrieve EU SME scheme exemption thresholds sourced from the official EU TEDB\nSMERetrievalService\
        \ SOAP API.\n\nReturns the most recent threshold record per `(country, tax_name, threshold_type)`\
        \ key\nas of the requested `date`. When a country has multiple schemes or tax names, each\nappears\
        \ as a separate item in the response.\n\n**Amounts**: All monetary amounts are in whole currency\
        \ units (EUR or the national\ncurrency identified by `nationalCurrency`). Null indicates the field\
        \ is not published\nfor that country/scheme combination.\n\n**Country codes**: TEDB uses `EL`\
        \ for Greece (instead of the ISO 3166-1 `GR`).\n\n**Query Parameters:**\n- `country` (optional):\
        \ ISO alpha-2 country code filter (e.g. `DE`, `EL` for Greece).\n- `date` (optional): YYYY-MM-DD.\
        \ Defaults to today UTC. Returns the most recent threshold\n  per key with `situation_on ≤ date`.\n\
        - `taxName` (optional): Case-insensitive exact match on the `taxName` field (e.g. `VAT`).\n- `tax_name`\
        \ (optional, deprecated): legacy snake_case alias for `taxName`.\n"
      operationId: listSmeThresholds
      parameters:
      - name: country
        in: query
        required: false
        schema:
          type: string
          minLength: 2
          maxLength: 2
        description: ISO 3166-1 alpha-2 country code filter. TEDB uses "EL" for Greece.
        example: DE
      - name: date
        in: query
        required: false
        schema:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        description: 'Reference date (YYYY-MM-DD). Returns the most recent threshold per key

          with `situation_on ≤ date`. Defaults to today UTC if omitted.

          '
        example: '2026-01-01'
      - name: taxName
        in: query
        required: false
        schema:
          type: string
        description: Case-insensitive exact match on the TEDB tax name (e.g. "VAT").
        example: VAT
      - name: tax_name
        in: query
        required: false
        deprecated: true
        schema:
          type: string
        description: Legacy snake_case alias for `taxName`.
        example: VAT
      responses:
        '200':
          description: SME threshold list
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmeThresholdsListResponse'
              example:
                thresholds:
                - country: PL
                  situationOn: '2026-01-01'
                  taxName: VAT
                  thresholdType: Regular scheme / specific scheme
                  nationalCurrency: PLN
                  cashAccountingEur: 5000.25
                  cashAccountingNac: 21000.75
                  flatRateSchemeEur: 6000.5
                  flatRateSchemeNac: 25000.25
                  reducedSupplyOfServicesEur: 7000.75
                  reducedSupplyOfServicesNac: 29000.5
                  nonEstablishedBusinessEur: 8000.25
                  nonEstablishedBusinessNac: 33000.75
                  exemption:
                    thresholdEur: 22000.5
                    thresholdNac: 240000.75
                    oneNationalAnnualThreshold: true
                    nationalAnnualThreshold: false
                    exclusionArticle288QuarantinePeriod: 6 months
                    transitionalPeriodExceeded: sectoral
                    voluntaryCessationArticle290: true
                    article290QuarantinePeriod: 12 months
                    sectorals: []
        '400':
          description: Invalid request parameters
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidCountry:
                  summary: Invalid country code
                  value:
                    error: invalid_country
                    detail: country must be a 2-letter ISO 3166-1 alpha-2 code
                invalidDate:
                  summary: Invalid date format
                  value:
                    error: invalid_date
                    detail: date must be in YYYY-MM-DD format
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the rate limit resets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: rate_limit_exceeded
                detail: too many requests, please try again later
        '500':
          description: Internal server error
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/vat/sme-eligibility:
