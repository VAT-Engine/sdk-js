  /v1/reports/oss-quarterly-summary:
    get:
      summary: Union OSS Quarterly Summary Preview
      security:
      - ApiKeyAuth: []
      description: 'Builds a read-only Union OSS quarterly summary preview from filing-grade `vat_supply_events`.


        The result is grouped according to the Union OSS return structure:

        - `2a` services supplied from the Member State of identification

        - `2b` goods dispatched or transported from the Member State of identification

        - `2c` services supplied from fixed establishments in another Member State

        - `2d` goods dispatched or transported from another Member State


        Requirements and current limits:

        - Requires exactly one overlapping `active` or `ended` `union_oss` registration for the requested
        quarter.

        - Excludes source events whose `classification_status` is not `classified`, zero-rated, exempt,
        new-means-of-transport, and assembly/installation supplies.

        - Keeps separate rows when more than one actual VAT rate applies within the same standard/reduced
        return grouping.

        - Uses ECB rates from the last day of the quarter when conversion is required, including the return
        currency of the Member State of identification.

        - Refunds, cancellations, credit notes, and adjustments are included only when they can be linked
        to the original filed supply event. Same-quarter corrections net into the current return rows;
        earlier-quarter corrections are emitted as later-period correction rows.

        - Payable VAT is calculated per Member State of consumption, and a negative balance in one Member
        State does not offset VAT payable in another Member State.

        - Current implementation is a preview endpoint and does not persist return periods or filing states.

        '
      operationId: getUnionOSSQuarterlySummary
      parameters:
      - $ref: '#/components/parameters/ExpectedContext'
      - name: period
        in: query
        required: true
        schema:
          type: string
          pattern: ^\d{4}-Q[1-4]$
        description: Quarter key in `YYYY-Qn` format.
        example: 2026-Q1
      responses:
        '200':
          description: Quarterly summary preview
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OSSQuarterlySummaryResponse'
        '400':
          description: Missing or invalid quarter parameter
          content:
            application/json:
              examples:
                invalid_expected_context:
                  $ref: '#/components/examples/InvalidExpectedContext'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '409':
          description: Quarterly summary blocked by missing/ambiguous registration or missing required
            ECB rates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
        '422':
          description: Quarterly summary exceeds the current preview event cap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the rate limit resets
              example: 60
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: rate_limit_exceeded
                detail: too many requests, please try again later
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
