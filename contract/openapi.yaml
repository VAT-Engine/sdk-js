          example: 700
    TaxClassDetailResponse:
      type: object
      required:
      - id
      - name
      - description
      - source
      - group_slug
      - group_name
      - tags
      - rates
      properties:
        id:
          type: string
          example: books
        name:
          type: string
          example: Books
        description:
          type: string
          example: Books — printed and electronic (including e-books)
        source:
          type: string
          example: tedb
        group_slug:
          type: string
          example: books_publications
        group_name:
          type: string
          example: Books & Publications
        tags:
          type: array
          items:
            type: string
          example:
          - publications
          - printed
        rates:
          type: array
          items:
            $ref: '#/components/schemas/TaxClassCountryRate'
    TaxClassCountryRate:
      type: object
      required:
      - country
      - rate_bps
