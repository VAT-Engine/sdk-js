        knowledge_time:
          type: string
          format: date-time
        source_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        source_retrieved_at:
          type: string
          format: date-time
    ClassificationCatalogBinding:
      type: object
      additionalProperties: false
      required:
      - catalog_version
      - official_reference
      - valid_from
      - catalog_digest
      properties:
        catalog_version:
          type: string
          maxLength: 40
        official_reference:
          type: string
          format: uri
          maxLength: 1000
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
        catalog_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
    TaxClassListResponse:
      type: object
