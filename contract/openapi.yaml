    get:
      summary: List committed supply revisions
      operationId: listCommittedSupplyEvents
      tags:
      - Committed supplies
      security:
      - ApiKeyAuth: []
      description: Returns this account's API-committed revisions, newest first. Use an operational full
        or read-only key. Reporting uses the current revision for each economic event. These rows are
        separate from /v1/transactions.
      parameters:
      - $ref: '#/components/parameters/ExpectedContext'
      - in: query
        name: event_id
        schema:
          type: string
          format: uuid
      - in: query
        name: order_id
        schema:
          type: string
          maxLength: 256
      - in: query
        name: source_profile_id
        schema:
          type: string
          pattern: ^[1-9][0-9]*$
      - in: query
        name: source_id
        schema:
          type: string
          maxLength: 100
        description: Alternative to source_profile_id.
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: Inclusive UTC calendar date.
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: Inclusive UTC calendar date.
      - in: query
        name: country
        schema:
          type: string
          pattern: ^[A-Z]{2}$
      - in: query
        name: currency
        schema:
          type: string
          pattern: ^[A-Z]{3}$
      - in: query
        name: classification_status
        description: Retained input status.
        schema:
          type: string
          enum:
          - classified
          - excluded
          - needs_review
      - in: query
        name: rate_category
        description: Retained input category.
        schema:
          type: string
          enum:
          - standard
          - reduced
          - super_reduced
          - zero
          - parking
          - exempt
          - unknown
      - in: query
        name: cursor
        schema:
          type: string
          format: uuid
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Account-owned API supply revisions.
          headers:
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CommittedSupplyRecord'
                  next_cursor:
                    type: string
                    format: uuid
                    nullable: true
        '400':
          description: Invalid request body, identity, values, or query filters.
          headers:
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_expected_context:
                  $ref: '#/components/examples/InvalidExpectedContext'
        '401':
          description: An active API key is required.
          headers:
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: An operational key with the required scope and matching optional context is required.
          headers:
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                auth_context_mismatch:
                  $ref: '#/components/examples/AuthContextMismatch'
                insufficient_scope:
                  $ref: '#/components/examples/InsufficientScope'
                operational_key_required:
                  value:
                    error: operational_key_required
                    detail: use an operational key to read committed supplies
        '429':
          description: The API or write-specific limit was exceeded.
          headers:
