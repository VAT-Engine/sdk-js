                  description: Public Account ID shared by the account holder.
                agent_name:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: Name displayed for the account holder to review.
      responses:
        '202':
          description: Pending registration. Share the registration ID so the account holder can match
