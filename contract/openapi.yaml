  /v1/vat/calculate:
    post:
      summary: Calculate VAT
      security:
      - ApiKeyAuth: []
      description: 'Calculates net, VAT, and gross amounts from a VAT-inclusive or VAT-exclusive input.


        **Amount basis and compatibility field**: `gross_amount_minor` is the established input

        field name and is retained for API compatibility. When `price_includes_vat` is `true`, the

        field is a gross input and VAT is extracted. When `false`, the field is a net input and VAT

        is added. Send `price_includes_vat` explicitly for every request, including `false` for a

        net input; omitted or `null` values are rejected.


        **Rounding**: Calculations use integer minor units and round the VAT fraction half up.

        For inclusive input, VAT is rounded first and net is derived as gross minus VAT. For

        exclusive input, VAT is rounded first and gross is derived as net plus VAT. Responses

        always satisfy `gross_amount_minor = net_amount_minor + vat_amount_minor`.


        **Validation**: Input amounts must be non-negative. Resolved rates must be from 0% through

        1000% inclusive. A rate outside that range or an exclusive result that would overflow a

        signed 64-bit monetary amount returns `400 invalid_request`.


        **Monetary Amounts**: All monetary values are expressed in minor units (cents for EUR/USD):

        - 10000 = €100.00

        - 119000 = €1,190.00


        **VAT Rates**: Expressed in basis points (1 bp = 0.01%):

        - 700 bps = 7%

        - 1900 bps = 19%


        **Ownership and evidence**: With API-key v2 enabled, authentication is required and a

        successful call atomically stores the transaction and calculation evidence. The returned

        `calculation_id` is the existing transaction UUID. If API-key v2 is disabled, compatibility

        mode permits an unowned calculation but persists no transaction, evidence, or idempotency

        mapping; `calculation_id` is null and replay is ineligible.


        **Transaction Date**: Optional field that defaults to current UTC time if omitted.

        Accepts RFC3339 (e.g., "2024-03-15T14:30:00Z") or YYYY-MM-DD (e.g., "2024-03-15") format.

        Date-only input resolves to midnight UTC. The resolved timestamp is always returned.

        `transaction_date` is required when `Idempotency-Key` is supplied.


        **Idempotency**: An optional `Idempotency-Key` is tenant- and endpoint-scoped. An identical

        canonical request and normalized `X-Source-ID` return the original calculation; reuse with

        a different request body or source attribution returns `409 idempotency_conflict`. The raw

        key is never stored. Idempotency requires authentication.


        **Cache**: Results are cached in Redis for improved performance.

        '
      operationId: calculateVat
      parameters:
      - $ref: '#/components/parameters/ExpectedContext'
      - name: X-Source-ID
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Za-z0-9_/-]{1,100}$
        description: Optional stable headless storefront or custom checkout tag captured for transaction
          reporting and bound into idempotent request identity. Does not affect VAT calculation. Invalid
          values return `400 invalid_source_id`. Do not include personal data or secrets.
        example: headless-checkout
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[\x21-\x7E]+$
        description: Optional visible-ASCII retry key for authenticated calls. Requires an explicit transaction_date.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VatCalculateRequest'
            examples:
              grossInclusive:
                summary: Extract 19% VAT from a €119.00 gross input
                value:
                  country: DE
                  currency: EUR
                  tax_class_id: standard
                  gross_amount_minor: 11900
                  price_includes_vat: true
              netExclusive:
                summary: Add 19% VAT to a €100.00 net input
                value:
                  country: DE
                  currency: EUR
                  tax_class_id: standard
                  gross_amount_minor: 10000
                  price_includes_vat: false
              withRFC3339Date:
                summary: With RFC3339 transaction date
                value:
                  country: FR
                  currency: EUR
                  tax_class_id: standard
                  gross_amount_minor: 12000
                  price_includes_vat: true
                  transaction_date: '2024-06-20T10:30:00Z'
              withSimpleDate:
                summary: With YYYY-MM-DD transaction date
                value:
                  country: IT
                  currency: EUR
                  tax_class_id: standard
                  gross_amount_minor: 12200
                  price_includes_vat: true
                  transaction_date: '2024-06-20'
              withFutureDate:
                summary: With future date (pre-order)
                value:
                  country: ES
                  currency: EUR
                  tax_class_id: standard
                  gross_amount_minor: 12100
                  price_includes_vat: true
                  transaction_date: '2027-12-25'
      responses:
        '200':
          description: Successful VAT calculation
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VatCalculateResponse'
              examples:
                grossInclusive:
                  summary: Result from a €119.00 gross input at 19%
                  value:
                    calculation_id: 2f40a1d8-7ac5-4db0-a29f-8de7020a77a1
                    country: DE
                    currency: EUR
                    vat_rate_bps: 1900
                    gross_amount_minor: 11900
                    net_amount_minor: 10000
                    vat_amount_minor: 1900
                    transaction_date: '2026-08-28T00:00:00Z'
                    rate_provenance:
                      schema_version: rate-evidence/v1
                      evidence_status: legacy_unverifiable
                      source: legacy_recorded_window
                      effective_at: '2026-08-28T00:00:00Z'
                      source_evidence: []
                    calculation_provenance:
                      schema_version: calculation-evidence/v1
                      calculation_version: vat-calculator-half-up/v1
                      execution_digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                      ownership: tenant_owned
                      evidence_status: captured
                      replay_status: not_supported
                netExclusive:
                  summary: Result from a €100.00 net input at 19%
                  value:
                    calculation_id: 8e214ef7-29aa-4843-b538-f38ca4085f86
                    country: DE
                    currency: EUR
                    vat_rate_bps: 1900
                    gross_amount_minor: 11900
                    net_amount_minor: 10000
                    vat_amount_minor: 1900
                    transaction_date: '2026-08-28T00:00:00Z'
                    rate_provenance:
                      schema_version: rate-evidence/v1
                      evidence_status: legacy_unverifiable
                      source: legacy_recorded_window
                      effective_at: '2026-08-28T00:00:00Z'
                      source_evidence: []
                    calculation_provenance:
                      schema_version: calculation-evidence/v1
                      calculation_version: vat-calculator-half-up/v1
                      execution_digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                      ownership: tenant_owned
                      evidence_status: captured
                      replay_status: not_supported
        '401':
          description: Unauthorized – missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingApiKey:
                  summary: API key not provided
                  value:
                    error: missing_api_key
                    detail: X-API-Key header is required
                invalidApiKey:
                  summary: Invalid API key
                  value:
                    error: invalid_api_key
                    detail: invalid API key
          headers:
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '400':
          description: Invalid request
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_expected_context:
                  $ref: '#/components/examples/InvalidExpectedContext'
                invalidJson:
                  summary: Invalid JSON
                  value:
                    error: invalid_json
                    detail: unexpected end of JSON input
                invalidMoney:
                  summary: Invalid monetary amount
                  value:
                    error: invalid_money
                    detail: invalid currency code
                missingPriceIncludesVAT:
                  summary: Missing amount basis selector
                  value:
                    error: missing_price_includes_vat
                    detail: price_includes_vat is required and must explicitly be true for a gross input
                      or false for a net input
                missingGrossAmountMinor:
                  summary: Missing or null amount
                  value:
                    error: missing_gross_amount_minor
                    detail: gross_amount_minor is required and must explicitly contain an integer, including
                      for a zero amount
                invalidTransactionDate:
                  summary: Invalid transaction date format
                  value:
                    error: invalid_transaction_date
                    detail: invalid date format; expected RFC3339 (e.g., 2024-01-15T10:30:00Z) or YYYY-MM-DD
                      (e.g., 2024-01-15)
                invalidCalculation:
                  summary: Invalid rate, negative amount, or monetary overflow
                  value:
                    error: invalid_request
                    detail: invalid calculation parameters
                transactionDateRequiredForIdempotency:
                  summary: Idempotency requires a stable calculation instant
                  value:
                    error: transaction_date_required_for_idempotency
                    detail: transaction_date must be explicit when Idempotency-Key is supplied
        '404':
          description: No usable rate for the country, tax class, and date (`rate_not_found`).
          headers:
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency key conflict or ambiguous rate evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the rate limit resets
              example: 60
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: rate_limit_exceeded
                detail: too many requests, please try again later
        '500':
          description: Internal server error
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: internal_error
                detail: an internal error occurred
        '503':
          description: A service required to process the request is temporarily unavailable.
          headers:
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                data_environment_unavailable:
                  value:
                    error: data_environment_unavailable
                    detail: the API key data environment is unavailable
  /v1/vat/rates:
    get:
      summary: Lookup Recorded VAT Rate
      security:
      - ApiKeyAuth: []
      description: 'Retrieve the recorded VAT-rate row selected for a specific country, tax class, and
        date.

        Current live TEDB change windows can reflect apply time and are not yet guaranteed to prove

        the legal applicability interval or exact upstream snapshot.


        **Use cases:**

        - Debug VAT rate configuration

        - Preview rates before calculation

        - Inspect recorded rate lookup windows

        - Display rates to customers in advance


        **Query Parameters:**

        - `country` (required): ISO 3166-1 alpha-2 country code (`GR` for Greece)

        - `tax_class_id` (required): Tax class identifier

        - `at` (optional): Recorded-window lookup date (RFC3339 or YYYY-MM-DD format). Defaults to current
        UTC time.


        **Cache:** Results are cached in Redis for improved performance.

        '
      operationId: getVatRate
      parameters:
      - $ref: '#/components/parameters/ExpectedContext'
      - name: country
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 2
        description: ISO 3166-1 alpha-2 country code
        example: DE
      - name: tax_class_id
        in: query
        required: true
        schema:
          type: string
        description: Tax class identifier (e.g., "standard", "reduced", "books")
        example: books
      - name: at
        in: query
        required: false
        schema:
          type: string
        description: 'Recorded-window date for rate lookup. Defaults to current UTC time if omitted.

          Accepts RFC3339 (e.g., "2024-03-15T14:30:00Z") or YYYY-MM-DD (e.g., "2024-03-15") format.

          The selected window is not yet guaranteed to be a source-supported legal applicability interval.

          '
        example: '2024-01-15'
      responses:
        '200':
          description: VAT rate found
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VatRateResponse'
              example:
                country: DE
                tax_class_id: books
                rate_bps: 700
                valid_from: '2020-01-01T00:00:00Z'
                valid_to: null
        '401':
          description: Unauthorized – missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingApiKey:
                  summary: API key not provided
                  value:
                    error: missing_api_key
                    detail: X-API-Key header is required
                invalidApiKey:
                  summary: Invalid API key
                  value:
                    error: invalid_api_key
                    detail: invalid API key
          headers:
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '400':
          description: Invalid request parameters
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_expected_context:
                  $ref: '#/components/examples/InvalidExpectedContext'
                missingCountry:
                  summary: Missing country parameter
                  value:
                    error: missing_parameter
                    detail: country is required
                missingTaxClass:
                  summary: Missing tax_class_id parameter
                  value:
                    error: missing_parameter
                    detail: tax_class_id is required
                invalidDate:
                  summary: Invalid date format
                  value:
                    error: invalid_date
                    detail: invalid date format; expected RFC3339 (e.g., 2024-01-15T10:30:00Z) or YYYY-MM-DD
                      (e.g., 2024-01-15)
                invalidCountry:
                  summary: Invalid country code
                  value:
                    error: invalid_country
                    detail: invalid country code
                invalidTaxClass:
                  summary: Invalid tax class
                  value:
                    error: invalid_tax_class
                    detail: invalid tax class identifier
        '404':
          description: Rate not found
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: rate_not_found
                detail: no VAT rate found for the specified country, tax class, and date
        '409':
          description: Ambiguous rate (data integrity issue)
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: rate_ambiguous
                detail: multiple VAT rates found (data integrity issue)
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the rate limit resets
              example: 60
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: rate_limit_exceeded
                detail: too many requests, please try again later
        '500':
          description: Internal server error
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: internal_error
                detail: an internal error occurred
  /v1/classification-codes/{scheme}/{code}:
    get:
      summary: Look up an exact CN or CPA code in official source data
      description: Uses the retained official catalog covering the requested date and edition. The date
        defaults to the current UTC date. This lookup reports catalog facts. Use the informational VAT
        resolver to evaluate source rates and conditions.
      security: []
      parameters:
      - name: scheme
        in: path
        required: true
        schema:
          type: string
          enum:
          - cn
          - cpa
      - name: code
        in: path
        required: true
        schema:
          type: string
          maxLength: 24
      - name: catalog_version
        in: query
        required: false
        schema:
          type: string
          maxLength: 40
      - name: legal_date
        in: query
        required: false
        description: Date used to select the catalog edition. Defaults to the current UTC date.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Exact catalog node and public official-source provenance
          headers:
            Cache-Control:
              description: Catalog selection results must not be cached.
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationInformationalCode'
        '400':
          description: Invalid scheme, code, catalog version, legal date, or query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No retained official catalog covers the requested scheme, date and edition, or
            the selected catalog lacks the code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Multiple retained official catalogs cover the request. Specify the edition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Distributed classification limit exceeded
        '503':
          description: Classification service or distributed limiter unavailable
