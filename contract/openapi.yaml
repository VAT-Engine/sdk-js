              $ref: '#/components/headers/VATEnvironment'
  /v1/reports/locked-return-periods/union-oss/exports/{exportID}:
    get:
      summary: Download Locked Union OSS Export Artifact
      security:
      - ApiKeyAuth: []
      description: 'Downloads an immutable export artifact generated when a Union OSS quarter was locked.


        Export artifacts are account-scoped, immutable, and can be downloaded after a period is locked
        or

        marked filed. The response returns the stored artifact bytes with the original filename.

        '
      operationId: downloadLockedUnionOSSExportArtifact
      parameters:
      - $ref: '#/components/parameters/ExpectedContext'
      - name: exportID
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: Numeric locked export identifier.
        example: 41
      responses:
        '200':
          description: Locked export artifact download
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Content-Disposition:
              schema:
                type: string
              description: Attachment filename for the stored artifact.
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
          content:
            application/json:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid export identifier
          content:
            application/json:
              examples:
                invalid_expected_context:
                  $ref: '#/components/examples/InvalidExpectedContext'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          description: Locked return export was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the rate limit resets
              example: 60
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: rate_limit_exceeded
                detail: too many requests, please try again later
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
  /v1/vat/threshold-check:
    post:
      summary: Threshold Check
      security:
      - ApiKeyAuth: []
      description: "Check a VAT threshold. Behavior depends on the threshold type:\n- **OSS**: Selects\
        \ the approved immutable Article 59c policy for the supplier's\n  establishment Member State and\
        \ evaluates candidate net turnover for both the current and\n  preceding calendar years at the\
        \ authenticated source-event cutoff. Zero/exempt and\n  review-pending candidates remain in coverage.\
        \ Missing classification, statutory scope,\n  source time, establishment, or governed currency\
        \ evidence returns 422 rather than a\n  partial exceeded/remaining result. Daily ECB reporting\
        \ FX is not legal threshold evidence.\n- **IOSS**: Validates a single consignment amount against\
        \ the €150 threshold (Art. 369l).\n  No transaction aggregation is performed.\n\nRequires a V2\
        \ API key with `full` or `read-only` scope.\n"
      operationId: checkThreshold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThresholdCheckRequest'
      parameters:
      - $ref: '#/components/parameters/ExpectedContext'
      responses:
        '200':
          description: Threshold check result
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThresholdCheckResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              examples:
                invalid_expected_context:
                  $ref: '#/components/examples/InvalidExpectedContext'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          description: Threshold not found for the given type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
        '422':
          description: Governed Article 59c evidence is incomplete or conflicting (OSS only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article59cEvidenceIncompleteResponse'
          headers:
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the rate limit resets
              example: 60
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: rate_limit_exceeded
                detail: too many requests, please try again later
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
  /v1/compliance/threshold-status:
    get:
      summary: Compliance Threshold Status
      security:
      - ApiKeyAuth: []
      description: 'Returns governed Article 59c threshold evidence for the current and preceding calendar

        years in the approved establishment currency. Incomplete evidence produces an empty

        `checks` array and bounded issue codes; it never produces an understated legal-looking

        comparison. Threshold evidence remains separate from sole-establishment, taxation-option,

        registration, and filing-readiness conditions.

        IOSS is per-consignment and not included — use POST /v1/vat/threshold-check for IOSS validation.


        Requires a V2 API key with `full` or `read-only` scope.

        '
      operationId: complianceThresholdStatus
      parameters:
      - $ref: '#/components/parameters/ExpectedContext'
      responses:
        '400':
          $ref: '#/components/responses/InvalidExpectedContext'
        '200':
          description: Compliance status
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceStatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the rate limit resets
              example: 60
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: rate_limit_exceeded
                detail: too many requests, please try again later
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-VAT-Environment:
              $ref: '#/components/headers/VATEnvironment'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Send the scoped VAT Engine API key in X-API-Key. A sandbox key selects isolated test
        data. Authenticated responses include X-VAT-Environment.
  parameters:
    ExpectedContext:
      name: X-VAT-Expected-Context
      in: header
      required: false
      description: Supply one previously enrolled context ID. After authentication a malformed or repeated
        header returns 400 invalid_expected_context. A different valid ID returns 403 auth_context_mismatch
        before any business operation.
      schema:
        $ref: '#/components/schemas/AuthContextID'
  schemas:
    AuthContextID:
      type: string
      pattern: ^ctx_[0-9a-f]{64}$
      minLength: 68
      maxLength: 68
      example: ctx_590f1b59b9cf255b642ea90a1503572e60e821397aae3ae0088408d818128380
    AuthContext:
      type: object
      required:
      - context_id
      - environment
      - scopes
      properties:
        context_id:
          $ref: '#/components/schemas/AuthContextID'
        environment:
          type: string
          enum:
          - sandbox
          - production
          description: Matches X-VAT-Environment. Operational keys return production on every deployment.
        scopes:
          type: array
          minItems: 1
          description: Scope strings assigned to the authenticated key. Customer scopes include full,
            read-only, calculate-only and classification-resolve.
          items:
            type: string
          example:
          - calculate-only
    ErrorResponse:
      type: object
      required:
      - error
      - detail
      properties:
        error:
          type: string
          description: Error code
          example: invalid_json
        detail:
          type: string
          description: Human-readable error description
          example: unexpected end of JSON input
    InformationalVATResult:
      type: object
      required:
      - schema_version
      - status
      - query
      - informational_only
      - filing_ready
      - legal_applicability
      - classification
      - source
      - options
      - warnings
      - disclaimer
      - source_assumptions
      properties:
        schema_version:
          type: string
          enum:
          - vat-information/v1
        status:
          type: string
          enum:
          - resolved
          - conditional
          - multiple_options
          - unavailable
          description: Informational namespace only. Resolved requires verified complete evidence, one
            exact code and descriptive-scope match, explicit empty conditions, a unique catalog and covered
            source date. It never establishes legal or filing authority.
        query:
          $ref: '#/components/schemas/InformationalVATQuery'
        informational_only:
          type: boolean
          enum:
          - true
        filing_ready:
          type: boolean
          enum:
          - false
        legal_applicability:
          type: string
          enum:
          - not_established
        disclaimer:
          type: string
        source_assumptions:
          type: array
          items:
            type: string
          description: Explicit informational scope; never a proven legal interval or product qualification.
        warnings:
          type: array
          items:
            type: string
        classification:
          type: object
          nullable: true
          properties:
            version:
              type: string
            description:
              type: string
            display_code:
              type: string
            valid_from:
              type: string
              format: date
            valid_to:
              type: string
              format: date
              nullable: true
            source_reference:
              type: string
              format: uri
            source_digest:
              type: string
            root_digest:
              type: string
            node_digest:
              type: string
        source:
          type: object
          nullable: true
          properties:
            snapshot_id:
              type: string
            raw_sha256:
              type: string
            canonical_sha256:
              type: string
            parser_version:
              type: string
            retrieved_at:
              type: string
              format: date-time
            requested_from:
              type: string
              format: date
            requested_to:
              type: string
              format: date
            reference:
              type: string
              format: uri
        options:
          type: array
          maxItems: 128
          items:
            type: object
            required:
            - option_id
            - source_ordinal
            - source_row_digest
            - match_kind
            - matched_code
            - value_type
            - rate_bps
            - source_reported_date
            - category
            - conditions
            - conditions_state
            properties:
              option_id:
                type: string
                pattern: ^[a-f0-9]{64}$
              source_ordinal:
                type: integer
              source_row_digest:
                type: string
              match_kind:
                type: string
                enum:
                - exact
                - catalog_ancestor
              matched_code:
                type: string
              value_type:
                type: string
                enum:
                - DEFAULT
                - REDUCED_RATE
                - SUPER_REDUCED_RATE
                - PARKING_RATE
                - EXEMPTED
                - OUT_OF_SCOPE
                - NOT_APPLICABLE
              rate_bps:
                type: integer
                format: int64
                minimum: 0
                maximum: 100000
                nullable: true
              source_reported_date:
                type: string
                format: date
                nullable: true
              category:
                type: string
              conditions:
                type: string
              conditions_state:
                type: string
                enum:
                - not_reported
                - empty_reported
                - text_reported
                description: Native field absence differs from an explicitly empty field.
    InformationalVATQuery:
      type: object
      additionalProperties: false
      required:
      - country
      - scheme
      - code
      - date
      properties:
        country:
          type: string
          pattern: ^[A-Z]{2}$
        scheme:
          type: string
          enum:
          - cn
          - cpa
        code:
          type: string
          maxLength: 24
        date:
          type: string
          format: date
        catalog_version:
          type: string
          maxLength: 40
        snapshot_id:
          type: string
          pattern: ^[1-9][0-9]*$
    InformationalVATCalculationRequest:
      type: object
      additionalProperties: false
      required:
      - query
      - option_id
      - amount_minor
      - currency
      - price_includes_vat
      properties:
        query:
          $ref: '#/components/schemas/InformationalVATQuery'
        option_id:
          type: string
          pattern: ^[a-f0-9]{64}$
        amount_minor:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Supported ISO 4217 currency with defined minor units.
        price_includes_vat:
          type: boolean
        declared_attributes:
          type: object
          maxProperties: 16
          additionalProperties:
            type: string
            maxLength: 500
          description: Customer declarations only; never verified facts or automatic condition clearance.
    InformationalVATCalculation:
      type: object
      required:
      - option_id
      - currency
      - currency_scale
      - net_amount_minor
      - vat_amount_minor
      - gross_amount_minor
      - rate_bps
      - calculator_version
      - assumptions
      - declared_attributes
      - persistence
      properties:
        option_id:
          type: string
        currency:
          type: string
        currency_scale:
          type: integer
        net_amount_minor:
          type: string
          pattern: ^[0-9]+$
        vat_amount_minor:
          type: string
          pattern: ^[0-9]+$
        gross_amount_minor:
          type: string
          pattern: ^[0-9]+$
        rate_bps:
          type: integer
        calculator_version:
          type: string
        assumptions:
          type: array
          items:
            type: string
        declared_attributes:
          type: object
          additionalProperties:
            type: string
        persistence:
          type: string
          enum:
          - not_persisted
    CustomerVATEventsResponse:
      type: object
      required:
      - events
      - informational_only
      - filing_ready
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/CustomerVATResult'
        informational_only:
          type: boolean
          enum:
          - true
        filing_ready:
          type: boolean
          enum:
          - false
        filters:
          type: object
          description: Included when country or period is used. A filter that was not applied is an empty
            string.
          required:
          - country
          - period
          properties:
            country:
              type: string
              pattern: ^([A-Z]{2})?$
            period:
              type: string
              pattern: ^([0-9]{4}-Q[1-4])?$
        next_cursor:
          type: string
          description: Opaque cursor. Omitted on the last page.
      example:
        events: []
        informational_only: true
        filing_ready: false
    CustomerVATResult:
      type: object
      description: Current operational VAT evaluation. Queued or review results may have no calculation
        or retained classification. The state describes processing, and issue is empty when no review
        issue applies.
      required:
      - display
      - event
      - state
      - issue
      - scope
      - information
      - input_digest
      - informational_only
      - filing_ready
      properties:
        display:
          $ref: '#/components/schemas/CustomerVATDisplay'
        event:
          $ref: '#/components/schemas/CustomerVATEvent'
        state:
          type: string
          enum:
          - queued
          - review
          - calculated
          - locked
          - no_charge
        issue:
          type: string
          description: Operational issue code, or an empty string.
        scope:
          $ref: '#/components/schemas/CustomerVATScope'
        information:
          $ref: '#/components/schemas/CustomerVATInformation'
        calculation:
          $ref: '#/components/schemas/CustomerVATCalculation'
        rule_id:
          type: string
        rule_revision:
          type: integer
        input_digest:
          type: string
        original_calculation_digest:
          type: string
        original_review_event_id:
          type: string
        informational_only:
          type: boolean
          enum:
          - true
        filing_ready:
          type: boolean
          enum:
          - false
        source_alternatives:
          $ref: '#/components/schemas/CustomerVATInformation'
        source_rule_revision:
          type: integer
        provisional_product_revision:
          type: integer
        shopify_classification:
          $ref: '#/components/schemas/CustomerVATHistoricalShopifyClassification'
        catalog_classification:
          $ref: '#/components/schemas/CustomerVATCatalogClassification'
        operational_review:
          $ref: '#/components/schemas/CustomerVATOperationalReview'
        classification_candidates:
          type: array
          items:
            $ref: '#/components/schemas/CustomerVATClassificationCandidate'
        store_default:
          type: boolean
          enum:
          - true
        provisional:
          type: boolean
          enum:
          - true
    CustomerVATDisplay:
      type: object
      description: Displayable source amounts appear as exact minor-unit strings when available.
      required:
      - currency_scale
      properties:
        net_amount_minor:
          type: string
          pattern: ^-?[0-9]+$
        vat_amount_minor:
          type: string
          pattern: ^-?[0-9]+$
        gross_amount_minor:
          type: string
          pattern: ^-?[0-9]+$
        currency_scale:
          type: integer
          format: int32
          minimum: 0
          maximum: 6
        product_title:
          type: string
        order_name:
          type: string
        store_default_from:
          type: string
          format: date
    CustomerVATEvent:
      type: object
      description: Source event used for the evaluation. Event amounts ending in _minor are JSON int64
        values in the corresponding currency scale.
      required:
      - id
      - integration_id
      - source_profile_id
      - external_order_id
      - external_line_id
      - event_type
      - supply_date
      - currency
      - currency_scale
      - taxable_amount_minor
      - gross_amount_minor
      - member_state_consumption
      - supply_kind
      - customer_type
      - supplier_establishment_country
      - dispatch_country
      - fixed_establishment_country
      - import_origin_country
      - marketplace_deemed_supplier
      - excise_goods
      - is_new_means_of_transport
      - is_assembly_or_installation
      - original_supply_event_id
      - source_provenance
      - source_record_id
      - source_digest
      - price_includes_vat
      properties:
        id:
          type: string
        integration_id:
          type: integer
          format: int64
        source_profile_id:
          type: integer
          format: int64
        external_order_id:
          type: string
        external_line_id:
          type: string
        event_type:
          type: string
          enum:
          - sale
          - refund
          - cancellation
          - credit_note
          - adjustment
        supply_date:
          type: string
          format: date
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        currency_scale:
          type: integer
          format: int32
          minimum: 0
          maximum: 6
        taxable_amount_minor:
          type: integer
          format: int64
          description: JSON integer with int64 precision. For exact arithmetic above the JavaScript safe-integer
            range, use a lossless JSON parser.
        gross_amount_minor:
          type: integer
          format: int64
          description: JSON integer with int64 precision. For exact arithmetic above the JavaScript safe-integer
            range, use a lossless JSON parser.
        member_state_consumption:
          type: string
          pattern: ^([A-Z]{2})?$
        supply_kind:
          type: string
          enum:
          - goods
          - service
          - tbe_service
          - imported_goods
        customer_type:
          type: string
          enum:
          - b2b
          - b2c
          - unknown
        supplier_establishment_country:
          type: string
          pattern: ^[A-Z]{2}$
          nullable: true
        dispatch_country:
          type: string
          pattern: ^[A-Z]{2}$
          nullable: true
        fixed_establishment_country:
          type: string
          pattern: ^[A-Z]{2}$
          nullable: true
        import_origin_country:
          type: string
          pattern: ^[A-Z]{2}$
          nullable: true
        consignment_intrinsic_value_minor:
          type: integer
          format: int64
          description: JSON integer with int64 precision. For exact arithmetic above the JavaScript safe-integer
            range, use a lossless JSON parser.
        consignment_currency:
          type: string
        consignment_currency_scale:
          type: integer
          format: int32
          minimum: 0
          maximum: 6
        authenticated_shopify_payment:
          $ref: '#/components/schemas/CustomerVATHistoricalShopifyPayment'
        declared_payment_accepted_at:
          type: string
          format: date-time
        marketplace_deemed_supplier:
          type: boolean
        excise_goods:
          type: boolean
        is_new_means_of_transport:
          type: boolean
        is_assembly_or_installation:
          type: boolean
        original_supply_event_id:
          type: string
          nullable: true
        authenticated_source_time:
          type: string
          format: date-time
        declared_supply_occurred_at:
          type: string
          format: date-time
        declared_goods:
          $ref: '#/components/schemas/CustomerVATDeclaredGoods'
        source_provenance:
          type: string
        source_record_id:
          type: string
        source_digest:
          type: string
        price_includes_vat:
          type: boolean
          nullable: true
        declared_facts:
          $ref: '#/components/schemas/CustomerVATDeclaredFacts'
    CustomerVATHistoricalShopifyPayment:
      type: object
      description: Payment provenance retained on historical Shopify events.
      required:
      - provider
      - order_id
      - transaction_count
      properties:
        accepted_at:
          type: string
          format: date-time
        provider:
          type: string
        order_id:
          type: string
        transaction_id:
          type: string
        transaction_kind:
          type: string
        transaction_status:
          type: string
        parent_transaction_id:
          type: string
        transaction_count:
          type: integer
          minimum: 0
        issue:
          type: string
    CustomerVATDeclaredGoods:
      type: object
      properties:
        excise_goods:
          type: boolean
        is_new_means_of_transport:
          type: boolean
        is_assembly_or_installation:
          type: boolean
    CustomerVATDeclaredFacts:
      type: object
      required:
      - revision
      properties:
        revision:
          type: integer
        customer_type:
          type: string
          enum:
          - b2b
          - b2c
        destination_country:
          type: string
          pattern: ^[A-Z]{2}$
    CustomerVATScope:
      type: object
      description: Scope of the operational evaluation or saved rule. Unknown or inapplicable scope fields
        can be empty strings or zero identifiers.
      required:
      - integration_id
      - source_profile_id
      - product
      - variant
      - country
      - scheme
      - code
      - catalog_version
      - supply_kind
      - customer_type
      - supplier_country
      - dispatch_country
      - fixed_country
      - import_origin
      - marketplace
      - excise
      - new_means_of_transport
      - assembly
      properties:
        kind:
          type: string
          enum:
          - store_default
        integration_id:
