      properties:
        country:
          type: string
          example: DE
        rate_bps:
          type: integer
          format: int64
          example: 700
        valid_from:
          type: string
          format: date-time
          description: Recorded lookup-window start. Not yet guaranteed to be the legal applicability
            start.
          example: '2020-01-01T00:00:00Z'
        valid_to:
          type: string
          format: date-time
          nullable: true
          description: Recorded lookup-window end. Null means no recorded end.
          example: null
    SmeThresholdsListResponse:
      type: object
      required:
      - thresholds
      properties:
        thresholds:
          type: array
          items:
            $ref: '#/components/schemas/SmeThresholdItem'
    SmeThresholdItem:
      type: object
      required:
      - country
      - situationOn
      - taxName
      - thresholdType
      - nationalCurrency
      - exemption
      properties:
        country:
          type: string
          description: EU/TEDB country code (TEDB uses "EL" for Greece)
          example: DE
        situationOn:
          type: string
          format: date
          description: Effective date of this record (YYYY-MM-DD)
          example: '2024-01-01'
        taxName:
          type: string
          description: Tax scheme name as reported by TEDB
          example: VAT
        thresholdType:
          type: string
          description: Threshold type as reported by TEDB
          example: Regular scheme
        nationalCurrency:
          type: string
          description: ISO 4217 currency code of the national currency
          example: EUR
        cashAccountingEur:
          type: number
          format: double
          nullable: true
          description: Cash accounting annual threshold in whole EUR units
        cashAccountingNac:
          type: number
          format: double
          nullable: true
          description: Cash accounting annual threshold in whole national-currency units
        flatRateSchemeEur:
          type: number
          format: double
          nullable: true
          description: Flat-rate scheme threshold in whole EUR units
        flatRateSchemeNac:
          type: number
          format: double
          nullable: true
          description: Flat-rate scheme threshold in whole national-currency units
        reducedSupplyOfServicesEur:
          type: number
          format: double
          nullable: true
          description: Reduced supply-of-services threshold in whole EUR units
        reducedSupplyOfServicesNac:
          type: number
          format: double
          nullable: true
          description: Reduced supply-of-services threshold in whole national-currency units
        nonEstablishedBusinessEur:
          type: number
          format: double
          nullable: true
          description: Non-established business threshold in whole EUR units
        nonEstablishedBusinessNac:
          type: number
          format: double
          nullable: true
          description: Non-established business threshold in whole national-currency units
        exemption:
          $ref: '#/components/schemas/SmeExemptionItem'
    SmeExemptionItem:
      type: object
      required:
      - sectorals
      properties:
        thresholdEur:
          type: number
          format: double
          nullable: true
          description: Main exemption threshold in whole EUR units
          example: 22000
        thresholdNac:
          type: number
          format: double
          nullable: true
          description: Main exemption threshold in whole national-currency units
          example: 22000
        oneNationalAnnualThreshold:
          type: boolean
          nullable: true
          description: Single national annual threshold applies
        nationalAnnualThreshold:
          type: boolean
          nullable: true
          description: National annual threshold flag
        exclusionArticle288QuarantinePeriod:
          type: string
          nullable: true
          description: Article 288 exclusion quarantine period (verbatim TEDB text)
        transitionalPeriodExceeded:
          type: string
          nullable: true
          description: Transitional period exceeded policy text (verbatim TEDB text)
        voluntaryCessationArticle290:
          type: boolean
          nullable: true
          description: Voluntary cessation flag under Article 290
        article290QuarantinePeriod:
          type: string
          nullable: true
          description: Article 290 quarantine period text (verbatim TEDB text)
        sectorals:
          type: array
          description: Sector-specific exemption thresholds (empty array when none apply)
          items:
            $ref: '#/components/schemas/SmeSectoralItem'
    SmeSectoralItem:
      type: object
      required:
      - cnCodes
      - cpaCodes
      properties:
        sector:
          type: string
          nullable: true
          description: Sector name (verbatim TEDB text)
        exemptionThresholdEur:
          type: number
          format: double
          nullable: true
          description: Sectoral exemption threshold in whole EUR units
        exemptionThresholdNac:
          type: number
          format: double
          nullable: true
          description: Sectoral exemption threshold in whole national-currency units
        comment:
          type: string
          nullable: true
          description: Additional comment (verbatim TEDB text)
        cnCodes:
          type: array
          description: CN classification codes for this sectoral threshold
          items:
            $ref: '#/components/schemas/SmeCodeDetail'
        cpaCodes:
          type: array
          description: CPA classification codes for this sectoral threshold
          items:
            $ref: '#/components/schemas/SmeCodeDetail'
    SmeCodeDetail:
      type: object
      required:
      - value
      - description
      properties:
        value:
          type: string
          description: Classification code value
          example: '01.1'
        description:
          type: string
          description: Human-readable description of the code
          example: Growing of cereals (except rice)
    SmeEligibilityRequest:
      type: object
      required:
      - country
      - annual_turnover_nac
      - currency
      properties:
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code (TEDB uses EL for Greece)
          example: DE
        annual_turnover_nac:
          type: integer
          format: int64
          description: Annual turnover in minor units of the national currency
          example: 1800000
        currency:
          type: string
          description: ISO 4217 currency code matching the country's national currency on reference_date
          example: EUR
        reference_date:
          type: string
          format: date
          description: Optional YYYY-MM-DD date for threshold lookup. Defaults to today.
          example: '2025-01-01'
    SmeEligibilityResponse:
      type: object
      required:
      - country
      - currency
      - annual_turnover_nac
      - reference_date
      - eligibility_status
      - eligible_for_exemption
      - exceeded_by_nac
      - scheme_type
      - policy
      - sectorals
      - data_situation_on
      - disclaimer
      properties:
        country:
          type: string
          example: DE
        currency:
          type: string
          example: EUR
        annual_turnover_nac:
          type: integer
          format: int64
          description: Echo of the submitted turnover in minor units
          example: 1800000
        reference_date:
          type: string
          format: date
          example: '2025-01-01'
        exemption_threshold_nac:
          type: number
          format: double
          nullable: true
          description: Main exemption threshold in whole national-currency units; null when unavailable
            or when the selected evidence belongs to a different effective currency period
          example: 22000
        exemption_threshold_eur:
          type: number
          format: double
          nullable: true
          description: Main exemption threshold in whole EUR units
          example: 22000
        ecb_rate_eur:
          type: number
          format: double
          nullable: true
          description: ECB reference rate used to display the national threshold in EUR, expressed as
            1 EUR equals this many units of the submitted currency.
          example: 4.275
        ecb_rate_date:
          type: string
          format: date
          nullable: true
          description: ECB reference-rate date used for `ecb_rate_eur`.
          example: '2025-01-01'
        eligible_for_exemption:
          type: boolean
          nullable: true
          description: Whether the turnover is within the exemption threshold; null when eligibility_status
            is indeterminate
          example: true
        eligibility_status:
          type: string
          enum:
          - eligible
          - ineligible
          - indeterminate
          description: Explicit comparison result. Indeterminate means no usable same-currency national
            threshold was available and no eligibility conclusion was made.
          example: eligible
        exceeded_by_nac:
          type: integer
          format: int64
          nullable: true
          description: Amount by which turnover exceeds the threshold, 0 if within, or null when eligibility_status
            is indeterminate
          example: 0
        scheme_type:
          type: string
          description: TEDB threshold type (e.g. Regular scheme)
          example: Regular scheme
        policy:
          $ref: '#/components/schemas/SmeEligibilityPolicy'
        sectorals:
          type: array
          items:
            $ref: '#/components/schemas/SmeEligibilitySectoral'
        data_situation_on:
          type: string
          format: date
          description: Effective date of the underlying TEDB data
          example: '2024-01-01'
        disclaimer:
          type: string
          example: Domestic-only check (Art. 284 VAT Directive). Does not evaluate the EU cross-border
            SME scheme (Art. 284a). Consult a tax advisor for formal eligibility decisions.
    SmeEligibilityPolicy:
      type: object
      properties:
        one_national_annual_threshold:
          type: boolean
          nullable: true
          description: Single national annual threshold applies
        exclusion_article288_quarantine_period:
          type: string
          nullable: true
          description: Article 288 exclusion quarantine period (verbatim TEDB text)
        voluntary_cessation_article290:
          type: boolean
          nullable: true
          description: Voluntary cessation flag under Article 290
    SmeEligibilitySectoral:
      type: object
      properties:
        sector:
          type: string
          nullable: true
          description: Sector label (verbatim TEDB text)
        exemption_threshold_eur:
          type: number
          format: double
          nullable: true
          description: Sectoral exemption threshold in whole EUR units
        exemption_threshold_nac:
          type: number
          format: double
          nullable: true
          description: Sectoral exemption threshold in whole national-currency units; null when unavailable
            or when the parent evidence belongs to a different effective currency period
        comment:
          type: string
          nullable: true
          description: Additional comment (verbatim TEDB text)
    ThresholdListResponse:
      type: object
      required:
      - thresholds
      properties:
        thresholds:
          type: array
          items:
            $ref: '#/components/schemas/ThresholdItem'
    ThresholdItem:
      type: object
      required:
      - id
      - country
      - threshold_amount_minor
      - currency
      - effective_from
      - threshold_type
      properties:
        id:
          type: string
          example: abc123
        country:
          type: string
          example: EU
        threshold_amount_minor:
          type: integer
          format: int64
          description: Threshold amount in minor units (cents)
          example: 1000000
        currency:
          type: string
          example: EUR
        effective_from:
          type: string
          format: date
          example: '2021-07-01'
        effective_to:
          type: string
          format: date
          nullable: true
          example: null
        threshold_type:
          type: string
          enum:
          - oss
          - ioss
          example: oss
        description:
          type: string
          nullable: true
    CommittedSupplyInput:
      type: object
      additionalProperties: false
      required:
      - source_profile_id
      - event
      properties:
        source_profile_id:
          type: string
          pattern: ^[1-9][0-9]*$
          description: Decimal ID of an active Source Profile owned by this account.
        original_supply_event_id:
          type: string
          format: uuid
          description: Required for corrections. Omit for sales.
        event:
          $ref: '#/components/schemas/CommittedSupplyEventInput'
    CommittedSupplyEventInput:
      type: object
      additionalProperties: false
      required:
      - external_order_id
      - external_line_id
      - event_type
      - event_version
      - supply_date
      - supply_kind
      - currency
      - currency_scale
      - taxable_amount_minor
      - gross_amount_minor
      properties:
        external_order_id:
          type: string
          minLength: 1
          maxLength: 160
        external_line_id:
          type: string
          minLength: 1
          maxLength: 160
        external_event_id:
          type: string
          minLength: 1
          maxLength: 160
          description: Required for a refund or correction. Omit for a sale.
        event_type:
          type: string
          enum:
          - sale
          - refund
          - cancellation
          - credit_note
          - adjustment
        event_version:
          type: integer
          format: int64
          minimum: 1
        supply_date:
          type: string
          format: date
        supply_occurred_at:
          type: string
          format: date-time
          description: Customer-declared instant on the UTC supply date. Needed for operational Article
            59c evidence.
        declared_payment_accepted_at:
          type: string
          format: date-time
          description: Customer-declared actual payment acceptance for an imported-goods sale. Must match
            the UTC supply date.
        customer_type:
          type: string
          enum:
          - b2c
          - b2b
          - unknown
          default: unknown
        supply_kind:
          type: string
          enum:
          - goods
          - tbe_service
          - service
          - imported_goods
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        currency_scale:
          type: integer
          minimum: 0
          maximum: 4
        taxable_amount_minor:
          type: integer
          format: int64
        source_vat_amount_minor:
          type: integer
          format: int64
          description: VAT reported by the source. When omitted gross and taxable amounts must be equal.
        gross_amount_minor:
          type: integer
          format: int64
          description: Taxable amount plus source VAT when reported.
        prices_include_tax:
          type: boolean
          description: Price basis used by the source. Provide an explicit value for automatic VAT calculation.
        member_state_consumption:
          type: string
          minLength: 2
          maxLength: 2
          description: Actual EU destination. Missing destination requires review.
        supplier_establishment_country:
          type: string
          minLength: 2
          maxLength: 2
        dispatch_country:
          type: string
          minLength: 2
          maxLength: 2
        fixed_establishment_country:
          type: string
          minLength: 2
          maxLength: 2
        arrival_country:
          type: string
          minLength: 2
          maxLength: 2
        import_origin_country:
          type: string
          minLength: 2
          maxLength: 2
        marketplace_deemed_supplier:
          type: boolean
        excise_goods:
          type: boolean
          description: Provide an explicit value for an IOSS preview.
        is_new_means_of_transport:
          type: boolean
          description: Explicit fact needed for Union OSS preparation on goods.
        is_assembly_or_installation:
          type: boolean
          description: Explicit fact needed for Union OSS preparation on goods.
        consignment_intrinsic_value_minor:
          type: integer
          format: int64
          minimum: 0
        consignment_currency:
          type: string
          pattern: ^[A-Z]{3}$
        consignment_currency_scale:
          type: integer
          minimum: 0
          maximum: 4
        product_reference:
          type: string
          maxLength: 160
          description: Optional stable identifier for matching saved rate choices within this Source Profile.
        variant_reference:
          type: string
          maxLength: 160
        classification:
          type: object
          description: Optional exact catalogue declaration for a sale. Refunds and corrections inherit
            classification from the original sale.
          required:
          - scheme
          - code
          additionalProperties: false
          properties:
            scheme:
              type: string
              enum:
              - cn
              - cpa
            code:
              type: string
              maxLength: 24
            catalog_version:
              type: string
              maxLength: 40
        classification_reason:
          type: string
          maxLength: 500
          description: Customer explanation only. Zero-consideration sales require an explanation and
            supporting evidence.
        evidence:
          type: object
          description: Optional supporting JSON object up to 16 KiB. Reserved system facts supplied within
            it have no effect.
        observed_tax_lines:
          type: array
          maxItems: 256
          description: Customer-submitted observations. They do not establish official treatment or independently
            verified upstream identity.
          items:
            type: object
            required:
            - kind
            - origin
            additionalProperties: false
            properties:
              kind:
                type: string
                enum:
                - vat
                - duty
                - fee
                - unknown
              origin:
                type: string
                enum:
                - platform_calculated
                - merchant_supplied
                - marketplace_supplied
                - external_tax_service
                - unknown
              jurisdiction_country:
                type: string
                minLength: 2
                maxLength: 2
              rate_bps:
                type: integer
                minimum: 0
                maximum: 100000
              amount_minor:
                type: integer
                format: int64
              merchant_liable:
                type: boolean
              source_title:
                type: string
                maxLength: 160
              source_provider:
                type: string
                maxLength: 160
              derived:
                type: boolean
        customs_declaration_items:
          type: array
          maxItems: 256
          description: Customer-submitted item groupings for reference. They never establish authenticated
            customs completeness or relief.
          items:
            type: object
            required:
            - tariff_classification
            - description
            additionalProperties: false
            properties:
              declaration_line_reference:
                type: string
                maxLength: 160
              tariff_classification:
                type: string
                pattern: ^[0-9]{6,13}$
              description:
                type: string
                minLength: 1
                maxLength: 500
              origin_country:
                type: string
                minLength: 2
                maxLength: 2
