          pattern: ^[A-Z]{3}$
        rows:
          type: array
          items:
            $ref: '#/components/schemas/CustomerIOSSRow'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/OSSQuarterlySummaryWarning'
        source_event_count:
          type: integer
          minimum: 0
        included_source_event_count:
          type: integer
          minimum: 0
        excluded_source_event_count:
          type: integer
          minimum: 0
        simulated:
          type: boolean
          enum:
          - true
    CustomerIOSSRow:
      type: object
      required:
      - member_state_consumption
      - rate_category
      - vat_rate_bps
      - taxable_amount_minor
      - vat_amount_minor
      - source_event_count
      properties:
        member_state_consumption:
          type: string
        rate_category:
          type: string
          enum:
          - standard
          - reduced
          - provisional
        vat_rate_bps:
          type: integer
        taxable_amount_minor:
          type: string
          pattern: ^-?[0-9]+$
        vat_amount_minor:
          type: string
          pattern: ^-?[0-9]+$
        source_event_count:
          type: integer
          minimum: 0
        original_month:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
        source_provenances:
          type: array
          items:
            type: string
      example:
        member_state_consumption: DE
        rate_category: provisional
        vat_rate_bps: 1900
        taxable_amount_minor: '0'
        vat_amount_minor: '-1900'
        source_event_count: 1
        original_month: 2026-08
    CustomerVATAttentionResponse:
      type: object
      required:
      - pending_count
      - has_more
      properties:
        pending_count:
          type: integer
          minimum: 0
          maximum: 100
        has_more:
          type: boolean
    VatCalculateRequest:
      type: object
      required:
      - country
      - currency
      - tax_class_id
      - gross_amount_minor
      - price_includes_vat
      properties:
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code
          example: DE
          minLength: 2
          maxLength: 2
        currency:
          type: string
          description: ISO 4217 currency code
          example: EUR
          minLength: 3
          maxLength: 3
        tax_class_id:
          type: string
          description: Tax class identifier (e.g., "standard", "reduced", "books")
          example: standard
        gross_amount_minor:
          type: integer
          format: int64
          description: 'Input amount in minor units. This compatibility field is gross when

            `price_includes_vat` is `true` and net when it is `false`.

            This required field must contain an explicit integer; omitted and

            `null` values are invalid. Send `0` for a zero amount.

            '
          example: 11900
          minimum: 0
        price_includes_vat:
          type: boolean
          description: 'Amount basis selector. `true` extracts VAT from the gross input;

            `false` adds VAT to the net input. This required field must be sent explicitly;

            omitted and `null` values are invalid.

            '
          example: true
        transaction_date:
          type: string
          description: 'Optional transaction date. Defaults to current UTC time if omitted.

            Accepts RFC3339 (e.g., "2024-03-15T14:30:00Z") or YYYY-MM-DD (e.g., "2024-03-15") format.

            Future dates are allowed (useful for pre-orders and advance bookings).

            '
          example: '2024-06-20T10:30:00Z'
    VatCalculateResponse:
      type: object
      required:
      - calculation_id
      - country
      - currency
      - vat_rate_bps
      - gross_amount_minor
      - net_amount_minor
      - vat_amount_minor
      - transaction_date
      - rate_provenance
      - calculation_provenance
      properties:
        calculation_id:
          type: string
          format: uuid
          nullable: true
          description: Existing `vat_transactions.id` for an authenticated stored calculation; null for
            an unowned non-persisted response.
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code
          example: DE
        currency:
          type: string
          description: ISO 4217 currency code
          example: EUR
        vat_rate_bps:
          type: integer
          format: int64
          description: VAT rate in basis points (1 bp = 0.01%)
          example: 1900
        gross_amount_minor:
          type: integer
          format: int64
          description: Gross amount in minor units (includes VAT)
          example: 11900
        net_amount_minor:
          type: integer
          format: int64
          description: Net amount in minor units (excludes VAT)
          example: 10000
        vat_amount_minor:
          type: integer
          format: int64
          description: VAT amount in minor units
          example: 1900
        transaction_date:
          type: string
          format: date-time
          description: UTC calculation instant resolved from the request.
          example: '2026-08-28T00:00:00Z'
        rate_provenance:
          $ref: '#/components/schemas/RateProvenance'
        calculation_provenance:
          $ref: '#/components/schemas/CalculationProvenance'
    RateProvenance:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - evidence_status
      - source
      - effective_at
      - source_evidence
      properties:
        schema_version:
          type: string
          enum:
          - rate-evidence/v1
        evidence_status:
          type: string
          enum:
          - verified
          - legacy_unverifiable
          - unavailable
        source:
          type: string
          enum:
          - eu_tedb
          - legacy_recorded_window
        rate_data_version:
          type: string
        rate_row_digest:
          type: string
          pattern: ^[a-f0-9]{64}$
        source_manifest_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        rate_matrix_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        mapping_version:
          type: string
        mapping_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        effective_at:
          type: string
          format: date-time
        approved_at:
          type: string
          format: date-time
          nullable: true
        source_evidence:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/RateSnapshotReference'
    RateSnapshotReference:
      type: object
      additionalProperties: false
      required:
      - snapshot_id
      - raw_sha256
      - canonical_sha256
      - retrieved_at
      properties:
        snapshot_id:
          type: string
          format: uuid
          description: Opaque public evidence-snapshot identifier.
        raw_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        canonical_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        retrieved_at:
          type: string
          format: date-time
    CalculationProvenance:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - calculation_version
      - execution_digest
      - ownership
      - evidence_status
      - replay_status
      properties:
        schema_version:
          type: string
          enum:
          - calculation-evidence/v1
        calculation_version:
          type: string
        execution_digest:
          type: string
          pattern: ^$|^[a-f0-9]{64}$
          description: Empty only for legacy calculations whose executable version cannot be established.
        ownership:
          type: string
          enum:
          - tenant_owned
          - unowned
        evidence_status:
          type: string
          enum:
          - captured
          - legacy_unverifiable
          - unavailable
          - not_persisted
        replay_status:
          type: string
          description: 'Retained eligibility metadata. New calculations in the informational CORE release

            cannot produce the sealed, approved rate evidence required for exact replay.

            `ineligible` means the record lacks sufficient evidence or otherwise fails eligibility.

            `not_supported` is the compatibility status for records without replay support.

            `available` is reserved for records that meet the sealed-evidence requirements.

            Exact replay is deferred from the current customer release.

            '
          enum:
          - not_supported
          - ineligible
          - available
    VatRateResponse:
      type: object
      required:
      - country
      - tax_class_id
      - rate_bps
      - valid_from
      properties:
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code
          example: DE
        tax_class_id:
          type: string
          description: Tax class identifier
          example: books
        rate_bps:
          type: integer
          format: int64
          description: VAT rate in basis points (1 bp = 0.01%)
          example: 700
        valid_from:
          type: string
          format: date-time
          description: Recorded lookup-window start (RFC3339). Not yet guaranteed to be the legal applicability
            start.
          example: '2020-01-01T00:00:00Z'
        valid_to:
          type: string
          format: date-time
          nullable: true
          description: Recorded lookup-window end (RFC3339). Null means no recorded end.
          example: null
    ClassificationInformationalCode:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - scheme
      - exact_code
      - display_code
      - official_description
      - is_leaf
      - catalog
      - knowledge_time
      - source_sha256
      - source_retrieved_at
