    ThresholdCheckRequest:
      type: object
      required:
      - threshold_type
      properties:
        threshold_type:
          type: string
          enum:
          - oss
          - ioss
          description: Threshold type. Determines check behavior.
        from:
          type: string
          format: date
          description: Start date (OSS only). If supplied, must be 1 January of the cutoff year.
        to:
          type: string
          format: date
          description: Inclusive UTC cutoff date (OSS only). Cannot be in the future; defaults to the
            current instant.
        amount_minor:
          type: integer
          format: int64
          description: Consignment value in EUR minor units (IOSS only). Required when threshold_type
            is "ioss".
    ThresholdCheckResponse:
      type: object
      required:
      - threshold_type
      - threshold_minor
      - currency
      - currency_scale
      - current_minor
      - source_event_count
      - remaining_minor
      - percentage_used
      - exceeded
      - warning
      - historical_crossing_proven
      properties:
        threshold_type:
          type: string
          enum:
          - oss
          - ioss
        threshold_minor:
          type: integer
          format: int64
          description: Reviewed threshold amount in `currency` minor units
          example: 1000000
        currency:
          type: string
          example: EUR
        currency_scale:
          type: integer
          minimum: 0
          maximum: 4
          description: ISO 4217 minor-unit scale used by threshold and turnover amounts
          example: 2
        current_minor:
          type: integer
          format: int64
          description: Aggregated qualifying net turnover after authenticated linked adjustments (OSS),
            or consignment value (IOSS)
          example: 850000
        source_event_count:
          type: integer
          format: int64
          minimum: 0
          description: Number of committed qualifying B2C sale and linked-adjustment events included in
            the OSS threshold calculation; zero for IOSS. Domestic and other ineligible supporting events
            are not counted
          example: 12
        remaining_minor:
          type: integer
          format: int64
          description: Closing-balance headroom before a crossing is proven; permanently zero after an
            authenticated current- or preceding-year crossing
          example: 150000
        percentage_used:
          type: integer
          description: Closing-balance percentage of the threshold (0-100+); it may fall below 100 after
            a refund and does not reverse a proven crossing
          example: 85
        exceeded:
          type: boolean
          description: Whether an authenticated current- or preceding-year threshold crossing has been
            proven; once true, later adjustments do not reset it
        warning:
          type: boolean
          description: True when within 10% of threshold but not exceeded
        previous_year_minor:
          type: integer
          format: int64
          description: Preceding-calendar-year candidate net turnover (OSS only)
        previous_year_event_count:
          type: integer
          format: int64
          minimum: 0
        current_comparison:
          type: string
          enum:
          - unknown
          - at_or_below
          - above
          description: Article 59c comparison for the current year (OSS only).
        previous_comparison:
          type: string
          enum:
          - unknown
          - at_or_below
          - above
          description: Article 59c comparison for the preceding year (OSS only).
        evidence_status:
          type: string
          enum:
          - resolved
          - incomplete_evidence
          description: Governed closing-evidence state. A successful incomplete response is returned only
            when an earlier authenticated crossing is already proven.
        article_59c_applicability_status:
          type: string
          enum:
          - applicable
          - not_applicable
          - incomplete_evidence
          - conflicting_evidence
          description: Separate applicability state; threshold evidence does not prove sole establishment
            or a taxation option
        threshold_evidence_status:
          type: string
          enum:
          - complete
          - incomplete
          - conflicting
          - not_applicable
          description: Whether the amount-based current/preceding-year comparison has all material evidence
        filing_readiness:
          type: string
          enum:
          - ready
          - not_ready
          - unknown
          - unsupported
          - blocked_by_treatment
          - not_required
        current_year_candidate_event_count:
          type: integer
          format: int64
          minimum: 0
        preceding_year_candidate_event_count:
          type: integer
          format: int64
          minimum: 0
        current_year_excluded_event_count:
          type: integer
          format: int64
          minimum: 0
        preceding_year_excluded_event_count:
          type: integer
          format: int64
          minimum: 0
        current_year_blocking_event_count:
          type: integer
          format: int64
          minimum: 0
        preceding_year_blocking_event_count:
          type: integer
          format: int64
          minimum: 0
        current_year_coverage:
          type: array
          items:
            $ref: '#/components/schemas/Article59cCoverageGroup'
        preceding_year_coverage:
          type: array
          items:
            $ref: '#/components/schemas/Article59cCoverageGroup'
        current_year_crossing:
          description: First historical crossing; retained even when later authenticated adjustments reduce
            the final net amount
          allOf:
          - $ref: '#/components/schemas/Article59cCrossingEvidence'
        preceding_year_crossing:
          description: First historical preceding-year crossing; retained independently of the final adjusted
            net amount
          allOf:
          - $ref: '#/components/schemas/Article59cCrossingEvidence'
        historical_crossing_proven:
          type: boolean
          description: True when immutable current- or preceding-year evidence proves a first crossing,
            independently of the closing balance and later evidence gaps
        treatment_triggers:
          type: array
          items:
            $ref: '#/components/schemas/Article59cTreatmentTrigger'
        primary_treatment_driver:
          type: string
        legal_effective_date:
          type: string
          format: date
        establishment_country:
          type: string
          pattern: ^[A-Z]{2}$
        policy_version:
          type: string
        policy_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
        release_version:
          type: string
        release_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
        cutoff_at:
          type: string
          format: date-time
        issues:
          type: array
          items:
            type: string
        eur_only:
          type: boolean
          deprecated: true
          description: Compatibility field; true means governed OSS evidence is incomplete, never that
            a partial EUR total was accepted
        converted_currencies:
          type: array
          deprecated: true
          description: Compatibility field; governed Article 59c evaluation does not use daily reporting
            conversion
          items:
            type: string
            example: PLN
        unconverted_currencies:
          type: array
          description: Distinct currencies awaiting an approved statutory conversion policy
          items:
            type: string
            example: HUF
        disclaimer:
          type: string
          description: Threshold-evidence boundary; incomplete closing evidence after a proven historical
            crossing is distinguished from a state with no publishable exceeded/remaining conclusion
    Article59cCoverageGroup:
      type: object
      required:
      - reason_code
      - disposition
      - evidence_quality
      - materiality
      - event_count
      properties:
        reason_code:
          type: string
        disposition:
          type: string
          enum:
          - included
          - conclusively_excluded
          - unresolved
        evidence_quality:
          type: string
          enum:
          - complete
          - missing
          - conflicting
        materiality:
          type: string
          enum:
          - material
          - immaterial
        event_count:
          type: string
          pattern: ^[0-9]+$
        original_currency:
          type: string
          pattern: ^[A-Z]{3}$
    Article59cCrossingEvidence:
      type: object
      description: Public crossing provenance. Internal database identifiers and source-evidence digests
        are intentionally not exposed.
      required:
      - source_event_time
      - cumulative_before
      - cumulative_after
      properties:
        source_event_time:
          type: string
          format: date-time
        cumulative_before:
          $ref: '#/components/schemas/Article59cCanonicalMoney'
        cumulative_after:
          $ref: '#/components/schemas/Article59cCanonicalMoney'
    Article59cTreatmentTrigger:
      type: object
      required:
      - kind
      - causal
      - effective_from
      properties:
        kind:
          type: string
          enum:
          - voluntary_destination_taxation_option
          - union_oss_deemed_option
          - current_year_threshold_crossing
          - preceding_year_threshold_exceeded
        causal:
          type: boolean
        effective_from:
          type: string
          format: date
        minimum_bound_through:
          type: string
          format: date
        effective_cessation_at:
          type: string
          format: date
        dependency_revision:
          type: string
        dependency_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
    Article59cEvidenceIncompleteResponse:
      type: object
      required:
      - error
      - evidence_status
      - issues
      - cutoff_at
      properties:
        error:
          type: string
          enum:
          - article_59c_evidence_incomplete
          - article_59c_not_applicable
        evidence_status:
          type: string
          enum:
          - incomplete_evidence
          - conflicting_evidence
        issues:
          type: array
          items:
            type: string
        cutoff_at:
          type: string
          format: date-time
    ComplianceStatusResponse:
      type: object
      required:
      - checks
      - period
      - eur_only
      - disclaimer
      - evidence_status
      - article_59c_applicability_status
      - threshold_evidence_status
      - filing_readiness
      - current_year_candidate_event_count
      - preceding_year_candidate_event_count
      - current_year_excluded_event_count
      - preceding_year_excluded_event_count
      - current_year_blocking_event_count
      - preceding_year_blocking_event_count
      - current_year_coverage
      - preceding_year_coverage
      - historical_crossing_proven
      - treatment_triggers
      - primary_treatment_driver
      - legal_effective_date
      properties:
        checks:
          type: array
          description: Array of threshold check results (OSS only)
          items:
            $ref: '#/components/schemas/ThresholdCheckResponse'
        period:
          type: object
          description: Included period used for the threshold status calculation
          required:
          - from
          - to
          properties:
            from:
              type: string
              format: date
              example: 2026-01-01
            to:
              type: string
              format: date
              example: 2026-04-21
        eur_only:
          type: boolean
          deprecated: true
          description: Compatibility field; true means governed threshold evidence is incomplete
        converted_currencies:
          type: array
          deprecated: true
          description: Compatibility field; governed Article 59c evaluation does not use daily reporting
            conversion
          items:
            type: string
            example: PLN
        unconverted_currencies:
          type: array
          description: Distinct currencies awaiting an approved statutory conversion policy
          items:
            type: string
            example: HUF
        disclaimer:
          type: string
          description: Threshold-evidence boundary; incomplete closing evidence after a proven historical
            crossing is distinguished from a state with no publishable exceeded/remaining conclusion
        evidence_status:
          type: string
          enum:
          - resolved
          - incomplete_evidence
          - conflicting_evidence
          - not_applicable
        article_59c_applicability_status:
          type: string
          enum:
          - applicable
          - not_applicable
          - incomplete_evidence
          - conflicting_evidence
          description: Separate applicability state; threshold evidence alone does not prove sole establishment
        threshold_evidence_status:
          type: string
          enum:
          - complete
          - incomplete
          - conflicting
          - not_applicable
        filing_readiness:
          type: string
          enum:
          - ready
          - not_ready
          - unknown
          - unsupported
          - blocked_by_treatment
          - not_required
        current_year_candidate_event_count:
          type: integer
          format: int64
          minimum: 0
        preceding_year_candidate_event_count:
          type: integer
          format: int64
          minimum: 0
        current_year_excluded_event_count:
          type: integer
          format: int64
          minimum: 0
        preceding_year_excluded_event_count:
          type: integer
          format: int64
          minimum: 0
        current_year_blocking_event_count:
          type: integer
          format: int64
          minimum: 0
        preceding_year_blocking_event_count:
          type: integer
          format: int64
          minimum: 0
        current_year_coverage:
          type: array
          items:
            $ref: '#/components/schemas/Article59cCoverageGroup'
        preceding_year_coverage:
          type: array
          items:
            $ref: '#/components/schemas/Article59cCoverageGroup'
        historical_crossing_proven:
          type: boolean
          description: True when immutable current- or preceding-year evidence proves a first crossing,
            even if closing evidence is incomplete
        treatment_triggers:
          type: array
          items:
            $ref: '#/components/schemas/Article59cTreatmentTrigger'
        primary_treatment_driver:
          type: string
        legal_effective_date:
          type: string
          format: date
        issues:
          type: array
          description: Bounded evidence-gap codes
          items:
            type: string
  headers:
    RequestID:
      description: Request identifier for tracing. Returned in every response.
      schema:
        type: string
      example: 7b9d5d3a-2c5d-4d8a-8f91-9b0c6c5b7f1d
    VATEnvironment:
      description: Data environment selected by the authenticated key. Sandbox data is isolated from production.
        Present after successful key authentication, including later error responses; missing or invalid
        key responses may omit it.
      schema:
        type: string
        enum:
        - sandbox
        - production
  responses:
    InvalidExpectedContext:
      description: Malformed or repeated context assertion.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        X-VAT-Environment:
          $ref: '#/components/headers/VATEnvironment'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid_expected_context:
              $ref: '#/components/examples/InvalidExpectedContext'
    InsufficientScope:
      description: Forbidden. The key lacks a required scope or the supplied context assertion does not
        match (auth_context_mismatch).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            insufficient_scope:
              $ref: '#/components/examples/InsufficientScope'
            auth_context_mismatch:
              $ref: '#/components/examples/AuthContextMismatch'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        X-VAT-Environment:
          $ref: '#/components/headers/VATEnvironment'
  examples:
    InvalidExpectedContext:
      value:
        error: invalid_expected_context
        detail: Supply one valid X-VAT-Expected-Context header.
    InsufficientScope:
      value:
        error: insufficient_scope
        detail: API key does not have the required scope for this operation
    AuthContextMismatch:
      value:
        error: auth_context_mismatch
        detail: The authenticated API key does not match the expected context.
    InvalidInformationalRequest:
      value:
        error: invalid_informational_request
        detail: Use an EU country, full CN/CPA item code, YYYY-MM-DD date and supported monetary inputs.
    InvalidCustomerVATRequest:
      value:
        error: invalid_customer_vat_request
        detail: Check the code, catalog edition, dates and required confirmations.
