                - claim_token
                - verification_uri
                - expires_in
                - interval
                - environment
                - scopes
                properties:
                  registration_id:
                    type: string
                    format: uuid
                    description: Request reference displayed to the account holder.
                  claim_token:
                    type: string
                    description: Private token used by the agent to claim an approved key.
                  verification_uri:
                    type: string
                    format: uri
                  expires_in:
                    type: integer
                    description: Seconds until the registration expires.
                  interval:
                    type: integer
                    description: Minimum seconds between claim attempts.
                  environment:
                    type: string
                    enum:
                    - sandbox
                  scopes:
                    type: array
                    items:
                      type: string
                      enum:
                      - calculate-only
